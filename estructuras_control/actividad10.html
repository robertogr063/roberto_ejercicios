<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*Modifica el ejercicio 2 para que se compruebe si existen números que son iguales. 
        Al introducir un numero que ya estaba se le comunica al usuario, pero ya se queda como introducido.
        Al finalizar el programa se indica que numero es el mayor y si se introdujeron números iguales, 
        en cuyo caso el programa escribiría: "El segundo y el primero son iguales". 
        Ten en cuenta que puede haber varios numeros iguales o parejas de numeros iguales.
        Puedes usar bucles, pero no arrays.
        */
       //Sin array

       let mayor = 0;
       let iguales = '';

       let numero1 = prompt('Introduce el número 1');
        if (mayor<numero1){
            mayor = numero1;
        }

       let numero2 = prompt('Introduce el número 2');
       if (mayor < numero2) {
            mayor = numero2;

        }
        if (numero2 == numero1) {
            iguales += 'primero y segundo,';
        }
        let numero3 = prompt('Introduce el número 3');
        if (mayor < numero3) {
            mayor = numero3;
        }
        if (numero3 == numero1) {
            iguales += 'primero y tercero,';
        }
        if (numero3 == numero2) {
            iguales += 'segundo y tercero,';
        }
        let numero4 = prompt('Introduce el número 4');
        if (mayor < numero4) {
            mayor = numero4;
        }
        if (numero4 == numero1) {
            iguales += 'primero y cuarto,';
        }
        if (numero4 == numero2) {
            iguales += 'segundo y cuarto,';
        }
        if (numero4 == numero3) {
            iguales += 'tercero y cuarto,';
        }
        let numero5 = prompt('Introduce el número 5');
        if (mayor < numero5) {
            mayor = numero5;
        }
        if (numero5 == numero1) {
            iguales += 'primero y quinto,';
        }
        if (numero5 == numero2) {
            iguales += 'segundo y quinto,';
        }
        if (numero5 == numero3) {
            iguales += 'tercero y quinto,';
        }
        if (numero5 == numero4) {
            iguales += 'cuarto y quinto,';
        }

        let mayores = '';
        if (numero1==mayor){
            mayores+='primero,';
        }
        if (numero2==mayor){
            mayores+='segundo,';
        }
        if (numero3==mayor){
            mayores+='tercero,';
        }
        if (numero4==mayor){
            mayores+='cuarto,';
        }
        if (numero5==mayor){
            mayores+='quinto,';
        }
        alert('Numeros mayores: ' + mayores.substring(0, mayores.length - 1));
        alert('Numeros iguales: ' + iguales.substring(0, iguales.length - 1));

    </script>
    
</body>
</html>
