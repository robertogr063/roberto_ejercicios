<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt('Introduce el valor de a');
        let b = prompt('Introduce el valor de b');

        if(a>b){
            alert('El mayor es A');
        } else{
            if(a==b){
                alert('Son iguales');
            } else{
                alert('El mayor es B');
            }
        }

    </script>
</body>
</html>
